<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us IRL Hub</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <!-- PeerJS for Cameras -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- ROLE SELECTOR (Initial Screen) -->
    <div id="role-selector-screen">
        <h1 class="glitch">AMONG US IRL</h1>
        <p>Select the role for this device:</p>
        <div class="menu-grid">
            <button class="menu-btn" onclick="switchView('host-view')">💻 HOST COMPUTER</button>
            <button class="menu-btn" onclick="switchView('player-view')">📱 PLAYER PHONE</button>
            <button class="menu-btn" onclick="switchView('tablet-view')">📟 TASK TABLET</button>
            <button class="menu-btn" onclick="switchView('camera-view')">📹 SECURITY CAM</button>
        </div>
    </div>

    <!-- 1. HOST COMPUTER VIEW -->
    <div id="host-view" class="role-section" style="display:none;">
        <div id="host-lobby">
            <h1>COMMAND CENTER</h1>
            <div class="lobby-box">
                <h3>Players Joined: <span id="player-count">0</span></h3>
                <ul id="player-list"></ul>
                <button onclick="startGame()">START GAME</button>
            </div>
        </div>
        <div id="host-dashboard" style="display:none;">
            <div class="progress-container"><div id="task-progress-bar"></div></div>
            <div class="main-layout">
                <div id="camera-grid"></div>
                <div id="status-board"></div>
            </div>
        </div>
    </div>

    <!-- 2. PLAYER PHONE VIEW -->
    <div id="player-view" class="role-section" style="display:none;">
        <div id="player-setup">
            <input type="text" id="playerNameInput" placeholder="Enter Name">
            <button onclick="joinGame()">JOIN LOBBY</button>
        </div>
        <div id="player-game" style="display:none;">
            <h2 id="role-text"></h2>
            <div id="room-buttons">
                <!-- Room buttons like 'Kitchen', 'Laundry' -->
            </div>
            <button id="kill-btn" class="danger-btn" style="display:none;" onclick="tryKill()">KILL</button>
            <button class="report-btn" onclick="callMeeting()">REPORT / EMERGENCY</button>
        </div>
    </div>

    <!-- 3. TASK TABLET VIEW -->
    <div id="tablet-view" class="role-section" style="display:none;">
        <div id="tablet-setup">
            <h2>Assign this Tablet to a Room:</h2>
            <div id="tablet-room-selection"></div>
        </div>
        <div id="tablet-active" style="display:none;">
            <h1 id="tablet-room-name"></h1>
            <div id="active-tasks-container"></div>
        </div>
    </div>

    <!-- 4. SECURITY CAMERA VIEW -->
    <div id="camera-view" class="role-section" style="display:none;">
        <div id="camera-setup">
            <h2>Camera Room:</h2>
            <div id="camera-room-selection"></div>
        </div>
        <div id="camera-active" style="display:none;">
            <h2 id="cam-display-name"></h2>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- EMERGENCY OVERLAY -->
    <div id="meeting-overlay" class="meeting-overlay" style="display:none;">
        <h1>EMERGENCY MEETING</h1>
        <button onclick="endMeeting()">RESUME</button>
    </div>

    <script src="app.js"></script>
    <script>
        // VIEW SWITCHING LOGIC
        function switchView(viewId) {
            document.getElementById('role-selector-screen').style.display = 'none';
            document.querySelectorAll('.role-section').forEach(sec => sec.style.display = 'none');
            document.getElementById(viewId).style.display = 'block';

            // Initialize specific role logic
            if (viewId === 'host-view') initHost();
            if (viewId === 'player-view') initPlayer();
            if (viewId === 'tablet-view') initTabletSelection();
            if (viewId === 'camera-view') initCameraSelection();
        }

        // --- HOST LOGIC ---
        function initHost() {
            db.ref('players').on('value', snap => {
                const players = snap.val() || {};
                document.getElementById('player-count').innerText = Object.keys(players).length;
                document.getElementById('player-list').innerHTML = Object.values(players).map(p => `<li>${p.name}</li>`).join('');
                updateHostDashboard(players);
            });
            initHostCameras();
        }

        // --- PLAYER LOGIC ---
        function initPlayer() {
            const roomDiv = document.getElementById('room-buttons');
            ROOMS.forEach(room => {
                let b = document.createElement('button');
                b.innerText = room;
                b.onclick = () => db.ref(`players/${myId}/currentRoom`).set(room);
                roomDiv.appendChild(b);
            });

            db.ref(`players/${myId}`).on('value', snap => {
                const data = snap.val();
                if (data && data.role) {
                    document.getElementById('player-setup').style.display = 'none';
                    document.getElementById('player-game').style.display = 'block';
                    document.getElementById('role-text').innerText = "YOU ARE: " + data.role.toUpperCase();
                    document.getElementById('role-text').className = data.role + "-text";
                    if(data.role === 'impostor') document.getElementById('kill-btn').style.display = 'block';
                }
            });
        }

        function joinGame() {
            const name = document.getElementById('playerNameInput').value;
            db.ref(`players/${myId}`).set({ name: name, status: 'alive', currentRoom: 'Lobby' });
        }

        // --- TABLET LOGIC ---
        function initTabletSelection() {
            const div = document.getElementById('tablet-room-selection');
            ROOMS.forEach(room => {
                let b = document.createElement('button');
                b.innerText = room;
                b.onclick = () => startTablet(room);
                div.appendChild(b);
            });
        }

        function startTablet(room) {
            document.getElementById('tablet-setup').style.display = 'none';
            document.getElementById('tablet-active').style.display = 'block';
            document.getElementById('tablet-room-name').innerText = room + " Station";
            monitorRoomTasks(room);
        }

        // --- CAMERA LOGIC ---
        function initCameraSelection() {
            const div = document.getElementById('camera-room-selection');
            ROOMS.forEach(room => {
                let b = document.createElement('button');
                b.innerText = room;
                b.onclick = () => startCameraFeed(room);
                div.appendChild(b);
            });
        }
    </script>

    <style>
        /* ADD THIS TO YOUR style.css or keep here */
        .menu-grid { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px; }
        .menu-btn { width: 300px; height: 80px; font-weight: bold; border-radius: 15px; border: 4px solid #fff; transition: 0.3s; }
        .menu-btn:hover { background: #fff; color: #000; transform: scale(1.05); }
        .role-section { width: 100%; height: 100vh; padding: 20px; box-sizing: border-box; }
        .glitch { font-size: 4rem; color: #ff3333; text-shadow: 2px 2px #33ffff; }
        .danger-btn { background: #ff0000; color: white; padding: 20px; width: 100%; font-size: 2rem; margin-top: 20px; }
        #localVideo { width: 100%; max-width: 600px; border: 5px solid #333; }
    </style>
</body>
</html>
