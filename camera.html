<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Camera - Among Us IRL</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase (Must match your other files) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <!-- PeerJS for Video Streaming -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="camera-setup">
        <h1>CCTV SETUP</h1>
        <p>Select which room this camera is monitoring:</p>
        <div id="room-buttons">
            <!-- Buttons generated by JS -->
        </div>
    </div>

    <div id="camera-active" class="screen">
        <h2 id="room-display">Room: ---</h2>
        <div class="status-indicator">● LIVE FEED</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <p>Keep this screen awake and browser open.</p>
        <button onclick="location.reload()" style="background: #333;">Change Room</button>
    </div>

    <script src="app.js"></script>
    <script>
        const roomButtons = document.getElementById('room-buttons');
        const setupDiv = document.getElementById('camera-setup');
        const activeDiv = document.getElementById('camera-active');
        const videoElement = document.getElementById('localVideo');
        
        let localStream;
        let peer;

        // 1. Create Room Buttons
        ROOMS.forEach(room => {
            let btn = document.createElement('button');
            btn.innerText = room;
            btn.onclick = () => startCamera(room);
            roomButtons.appendChild(btn);
        });

        async function startCamera(roomName) {
            document.getElementById('room-display').innerText = "Room: " + roomName;
            setupDiv.style.display = 'none';
            activeDiv.classList.add('active');

            try {
                // 2. Get Video Stream (Back camera preferred)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                videoElement.srcObject = localStream;

                // 3. Initialize PeerJS
                // We use a specific ID format so the host can find it: "camera-RoomName"
                const peerId = 'among-us-cam-' + roomName.replace(/\s+/g, '-').toLowerCase();
                peer = new Peer(peerId);

                peer.on('open', (id) => {
                    console.log('Camera registered with ID:', id);
                    // Tell Firebase this camera is online
                    db.ref(`cameras/${roomName}`).set({
                        peerId: id,
                        status: 'online',
                        lastActive: Date.now()
                    });
                });

                // 4. Answer incoming "calls" from the Host Computer
                peer.on('call', (call) => {
                    call.answer(localStream); // Send our video stream to the host
                });

                // Handle disconnects
                window.onbeforeunload = () => {
                    db.ref(`cameras/${roomName}`).remove();
                };

            } catch (err) {
                alert("Camera error: " + err.message);
                location.reload();
            }
        }
    </script>

    <style>
        #localVideo {
            width: 90%;
            max-width: 500px;
            border: 5px solid #333;
            border-radius: 10px;
            background: #000;
            transform: scaleX(1); /* Change to -1 if using front camera */
        }
        .status-indicator {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 10px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        #room-buttons button {
            display: block;
            width: 80%;
            margin: 10px auto;
        }
    </style>
</body>
</html>
