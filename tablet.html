<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us IRL - Task Station</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <!-- 1. TABLET SETUP SCREEN -->
    <div id="tablet-setup" class="role-section">
        <h1 class="glitch">TASK STATION SETUP</h1>
        <h2>Assign this Tablet to a Room:</h2>
        <p style="color:#aaa; margin-bottom: 20px;">The tablet will save its current location to detect nearby crewmates.</p>
        <div id="tablet-room-selection" class="room-grid"></div>
    </div>

    <!-- 2. ACTIVE TASK MONITORING SCREEN -->
    <div id="tablet-active" class="role-section" style="display:none;">
        <h1 id="tablet-room-name" style="color: #33ffff; text-shadow: 0 0 10px #33ffff;"></h1>
        <p id="calibration-status" style="color: #ffff33; margin-bottom: 20px;">🛰️ Calibrating GPS coordinates...</p>
        
        <div id="active-tasks-container">
            <!-- Dynamically populated when players are within physical radius -->
        </div>
        
        <hr>
        <button onclick="location.reload()" class="reset-btn" style="max-width: 200px; margin: 20px auto; display: block;">⚙️ Change Room</button>
    </div>

    <!-- Link to the shared logic file -->
    <script src="app.js"></script>
    <script>
        window.onload = () => {
            initTabletSetup();
        };

        function initTabletSetup() {
            const div = document.getElementById('tablet-room-selection');
            div.innerHTML = "";
            
            ROOMS.forEach(room => {
                let b = document.createElement('button');
                b.className = "menu-btn";
                b.style.margin = "5px";
                b.innerText = room;
                b.onclick = () => {
                    startTablet(room);
                };
                div.appendChild(b);
            });
        }

        function startTablet(room) {
            document.getElementById('tablet-setup').style.display = 'none';
            document.getElementById('tablet-active').style.display = 'block';
            document.getElementById('tablet-room-name').innerText = room.toUpperCase() + " STATION";
            
            // Get the tablet's location and save it as the reference position for this room
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const coords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    db.ref(`stations/${room}/coords`).set(coords).then(() => {
                        document.getElementById('calibration-status').innerHTML = "🛰️ LOCATION SAVED - RADAR ACTIVE";
                        document.getElementById('calibration-status').style.color = "#00ff00";
                        
                        // Start tracking nearby players
                        monitorRoomTasks(room);
                    });
                }, err => {
                    alert("Tablet GPS Error: Ensure location access is enabled on this browser.");
                    location.reload();
                }, { enableHighAccuracy: true });
            } else {
                alert("This device does not support GPS tracking.");
            }
        }
    </script>
</body>
</html>
