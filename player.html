<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us IRL - Player</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <!-- 1. PLAYER SETUP SCREEN -->
    <div id="player-setup" class="role-section">
        <h1 class="glitch">JOIN CREW</h1>
        <input type="text" id="playerNameInput" placeholder="Enter Your Name...">
        <button class="menu-btn" onclick="joinGame()">JOIN LOBBY</button>
        <p style="margin-top: 20px; color: #888;">Wait for the Host to start the game after joining.</p>
    </div>

    <!-- 2. MAIN GAMEPLAY SCREEN -->
    <div id="player-game" class="role-section" style="display:none;">
        <div id="role-reveal-box">
            <h2 id="role-text"></h2>
        </div>
        
        <div id="player-status-indicator"></div>
        <hr>
        
        <div class="radar-container">
            <p style="font-size: 1.1rem; color: #66fcf1; font-weight: bold;">🛰️ GPS POSITION ACTIVE</p>
            <p style="font-size: 0.8rem; color: #888;">Keep your browser open so tasks and impostors can detect you.</p>
        </div>
        
        <hr>
        <div class="player-actions">
            <!-- Kill button displays automatically when a crewmate is within radius -->
            <button id="kill-btn" class="danger-btn" style="display:none;" onclick="tryKill()">KILL</button>
            
            <button class="report-btn" onclick="callMeeting()">🚨 REPORT / EMERGENCY</button>
        </div>
    </div>

    <!-- 3. EMERGENCY MEETING & VOTING OVERLAY -->
    <div id="meeting-overlay" class="meeting-overlay" style="display:none;">
        <div class="meeting-box">
            <h1 style="color: #ff3333; margin-bottom: 5px;">🚨 EMERGENCY MEETING 🚨</h1>
            <p style="color: #fff;">Discuss and Vote! Ghosts cannot vote.</p>
            
            <div id="voting-list" class="voting-grid">
                <!-- Players generated here by JS -->
            </div>
            
            <div class="voting-actions">
                <button id="skip-vote-btn" class="skip-btn" onclick="castVote('skip')">⏭️ SKIP VOTE</button>
                <p id="wait-msg" style="display:none; color:#00ff00; font-weight:bold; font-size: 1.2rem;">Waiting for Host to tally votes...</p>
            </div>
        </div>
    </div>

    <!-- Link to the shared logic file -->
    <script src="app.js"></script>
    <script>
        window.onload = () => {
            initPlayerUI();
        };

        function initPlayerUI() {
            db.ref(`players/${myId}`).on('value', snap => {
                const data = snap.val();
                
                if (data && data.role) {
                    document.getElementById('player-setup').style.display = 'none';
                    document.getElementById('player-game').style.display = 'block';
                    
                    document.getElementById('role-text').innerText = "ROLE: " + data.role.toUpperCase();
                    document.getElementById('role-text').className = data.role + "-text";
                    document.getElementById('player-status-indicator').innerText = "STATUS: " + data.status.toUpperCase();
                    
                    if (data.role === 'impostor' && data.status === 'alive') {
                        // Start continuously checking for nearby crewmates
                        startKillProximityCheck();
                    } else {
                        document.getElementById('kill-btn').style.display = 'none';
                    }

                    if(data.status === 'ghost') {
                        document.body.style.filter = "grayscale(100%)";
                    } else {
                        document.body.style.filter = "none";
                    }
                    
                    // Activate player position updates
                    startLocationTracking();
                } else {
                    document.getElementById('player-setup').style.display = 'block';
                    document.getElementById('player-game').style.display = 'none';
                    document.body.style.filter = "none";
                }
            });
        }

        // --- VOTING SYSTEM LISTENER ---
        db.ref().on('value', snap => {
            const data = snap.val() || {};
            const isMeeting = data.meeting;
            const overlay = document.getElementById('meeting-overlay');

            if (isMeeting && document.getElementById('player-game').style.display === 'block') {
                overlay.style.display = 'flex';
                
                const players = data.players || {};
                const votes = data.votes || {};
                const list = document.getElementById('voting-list');
                list.innerHTML = "";
                
                const myVote = votes[myId];
                const amIAlive = players[myId] && players[myId].status === 'alive';

                for(let id in players) {
                    const p = players[id];
                    if (p.status === 'alive') {
                        const hasVoted = votes[id] ? "✅ Voted" : "⏳ Thinking...";
                        let btnHtml = "";
                        if (amIAlive && !myVote) {
                            btnHtml = `<button class="vote-action-btn" onclick="castVote('${id}')">VOTE</button>`;
                        }

                        list.innerHTML += `
                            <div class="vote-row">
                                <div class="vote-info">
                                    <span class="v-name">${p.name}</span> 
                                    <span class="v-status">${hasVoted}</span>
                                </div>
                                ${btnHtml}
                            </div>
                        `;
                    }
                }

                if (amIAlive && !myVote) {
                    document.getElementById('skip-vote-btn').style.display = 'block';
                    document.getElementById('wait-msg').style.display = 'none';
                } else {
                    document.getElementById('skip-vote-btn').style.display = 'none';
                    document.getElementById('wait-msg').style.display = 'block';
                }
                
            } else {
                overlay.style.display = 'none';
            }
        });

        db.ref('ejectionMessage').on('value', snap => {
            const msg = snap.val();
            if (msg) alert("🗳️ RESULT: " + msg);
        });
    </script>
</body>
</html>
